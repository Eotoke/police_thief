<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#f4efe4"><title>Police & Thief v0.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe4;color:#222;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}#app{max-width:760px;margin:auto;padding:10px}.title{text-align:center;font-size:20px;font-weight:950;margin:2px 0 7px}.top{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:13px;font-weight:850}.actions{display:flex;gap:5px}button{border:0;border-radius:11px;padding:10px;font:inherit;font-weight:850;touch-action:manipulation}.primary{background:#222;color:#fff}.secondary{background:#ddd;color:#222}.stage{position:relative;margin-top:8px}canvas{display:block;width:100%;aspect-ratio:4/3;border:2px solid #333;border-radius:14px;background:#dce8cd}.overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:12px;background:#000b;border-radius:14px}.overlay.show{display:flex}.box{width:min(460px,100%);padding:14px;background:#f8f5ee;border-radius:16px;text-align:center}.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.perk{min-height:122px;background:#fff;border:1px solid #aaa;padding:8px}.perk:disabled{opacity:.45}.perk .ico{font-size:24px}.perk small{display:block;font-weight:600;margin-top:5px}.banner{display:none;position:absolute;z-index:5;top:10px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:99px;background:#222;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}.pausebox{color:#fff;text-align:center}.pausebox b{font-size:24px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.power{text-align:center;border:1px solid #bbb;border-radius:8px;padding:6px;font-size:11px}.bar{height:4px;margin-top:4px;background:#ccc;overflow:hidden;border-radius:9px}.fill{display:block;height:100%;width:0;background:#555}.legend{text-align:center;font-size:11px;color:#555;margin:6px 0}.joy{height:160px;position:relative;border:2px dashed #aaa;border-radius:18px;touch-action:none;user-select:none;overflow:hidden}.joylabel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#777;font-size:13px;font-weight:850;pointer-events:none}.base{display:none;position:absolute;width:112px;height:112px;transform:translate(-50%,-50%);border:2px solid #8888;border-radius:50%;background:#fff6;pointer-events:none}.knob{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#222}.result{color:#fff;text-align:center}.result b{font-size:26px}.result button{margin-top:10px;background:#fff;color:#111}@media(max-width:430px){#app{padding:7px}.top{font-size:11px}.top button{padding:8px 7px}.perk{font-size:11px;min-height:118px}.perk small{font-size:9px}.legend{font-size:10px}.joy{height:145px}}
</style></head><body><main id="app">
<div class="title">POLICE &amp; THIEF <small>v0.7</small></div>
<div class="top"><span>❤️ <b id="lives">3</b> · ⏱ <b id="time">0:00</b></span><div class="actions"><button id="pauseBtn" class="secondary">⏸ Pause</button><button id="restart" class="primary">Restart</button></div><span>ROUND <b id="round">1</b>/10 · 🚓 <b id="copCount">1</b></span></div>
<div class="stage"><canvas id="game" width="720" height="540"></canvas><div id="banner" class="banner"></div>
<div id="pauseScreen" class="overlay"><div class="pausebox"><b>PAUSED</b><br><small>The chase is frozen.</small></div></div>
<div id="choice" class="overlay"><div class="box"><b>ROUND CLEARED ✨</b><div style="font-size:12px;margin:4px 0">Choose a power · Lv5 evolves it</div><div class="perks">
<button class="perk" data-p="friends"><span class="ico">🧑‍🤝‍🧑</span><br><b>Call Friends</b><small>Lv1–4: scatter<br>Lv5: ☠ seeker</small><div id="friendsLevel">Lv0</div></button>
<button class="perk" data-p="phase"><span class="ico">👻</span><br><b>Phase</b><small>Lv1–4: cross walls<br>Lv5: 🫥 vanish</small><div id="phaseLevel">Lv0</div></button>
<button class="perk" data-p="slow"><span class="ico">🌀</span><br><b>Slow Field</b><small>Lv1–4: slow pulse<br>Lv5: ❄ freeze</small><div id="slowLevel">Lv0</div></button>
</div></div></div>
<div id="over" class="overlay"><div class="result"><b id="result"></b><div id="score"></div><button id="again">Run again</button></div></div></div>
<div class="status"><div class="power">🧑‍🤝‍🧑 <b id="friendsStatus">Lv0</b><div class="bar"><i id="friendsBar" class="fill"></i></div></div><div class="power">👻 <b id="phaseStatus">Lv0</b><div class="bar"><i id="phaseBar" class="fill"></i></div></div><div class="power">🌀 <b id="slowStatus">Lv0</b><div class="bar"><i id="slowBar" class="fill"></i></div></div></div>
<div class="legend">★ You · T Thief · F Friend · ☠ Special · H Hunter · A Ambusher · B Berserker</div>
<div id="joy" class="joy"><div class="joylabel">DRAG TO RUN<br>360° CONTROL</div><div id="base" class="base"><div id="knob" class="knob"></div></div></div>
</main><script>
(()=>{'use strict';const E=id=>document.getElementById(id),C=E('game'),g=C.getContext('2d'),W=720,H=540;const walls=[{x:130,y:90,w:145,h:32},{x:430,y:70,w:34,h:165},{x:220,y:285,w:205,h:34},{x:550,y:355,w:110,h:32},{x:65,y:390,w:36,h:105}];let player,cops,thieves,round,lives,ended,paused,choosing,last,rt,jx=0,jy=0,pointer=null,origin={},powers,cd,phase=0,vanish=0,pulse=0,invuln=0;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const hit=(x,y,r=12)=>x<18+r||x>W-18-r||y<18+r||y>H-18-r||walls.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
function move(e,vx,vy,d,ghost=false){let nx=e.x+vx*d,ny=e.y+vy*d;if(ghost){e.x=Math.max(20,Math.min(W-20,nx));e.y=Math.max(20,Math.min(H-20,ny));return}if(!hit(nx,e.y,e.r))e.x=nx;if(!hit(e.x,ny,e.r))e.y=ny}
function spot(away,min=0){for(let i=0;i<300;i++){let p={x:35+Math.random()*(W-70),y:35+Math.random()*(H-70)};if(!hit(p.x,p.y,14)&&(!away||D(p,away)>min))return p}return{x:45,y:45}}
function steer(e,q,s,d,ghost=false){if(!q)return;let dx=q.x-e.x,dy=q.y-e.y,m=Math.hypot(dx,dy)||1,ox=e.x,oy=e.y;move(e,dx/m*s,dy/m*s,d,ghost);if(!ghost&&Math.hypot(e.x-ox,e.y-oy)<.3)move(e,-dy/m*s,dx/m*s,d)}
function normal(){let p=spot(player,55);thieves.push({x:p.x,y:p.y,r:11,s:128,alive:true,kind:'normal'})}function fresh(){thieves=[];for(let i=0;i<5;i++)normal()}
function nearestCop(x,y){let a=cops.filter(c=>c.alive);return a.reduce((q,c)=>!q||Math.hypot(c.x-x,c.y-y)<Math.hypot(q.x-x,q.y-y)?c:q,null)}
function friend(special=false,i=0,n=1){let angle=special?0:(Math.PI*2*i/n)+(Math.random()-.5)*.55,t=special?nearestCop(player.x,player.y):null;if(special&&t)angle=Math.atan2(t.y-player.y,t.x-player.x);thieves.push({x:player.x,y:player.y,r:special?12:10,s:special?130:150,alive:true,kind:special?'special':'friend',target:t,angle,grace:special?0:.5})}
function addCop(){let type=['H','A','B'][cops.length%3],p=spot(player,210);cops.push({x:p.x,y:p.y,r:13,s:108,type,alive:true,target:null,lock:0,flank:(cops.length%2?1:-1)*(65+20*(cops.length%3)),rage:0,rageClock:0,freeze:0,slow:0});count()}
function count(){E('copCount').textContent=cops.filter(c=>c.alive).length}function flash(s){E('banner').textContent=s;E('banner').style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>E('banner').style.display='none',900)}function pwr(c,m=1){c.s+=2.5*m;c.r=Math.min(27,c.r+.45*m)}function txt(k){return powers[k]>=5?'EVOLVED':'Lv'+powers[k]}
function ui(){E('lives').textContent=lives;E('round').textContent=round;['friends','phase','slow'].forEach(k=>{E(k+'Level').textContent=txt(k);E(k+'Status').textContent=txt(k)});document.querySelectorAll('.perk').forEach(b=>b.disabled=powers[b.dataset.p]>=5)}
function reset(){player={x:80,y:70,r:12,s:205};cops=[];round=1;lives=3;ended=paused=choosing=false;rt=0;powers={friends:0,phase:0,slow:0};cd={friends:0,phase:0,slow:0};phase=vanish=pulse=invuln=0;jx=jy=0;fresh();addCop();['over','choice','pauseScreen'].forEach(x=>E(x).classList.remove('show'));E('pauseBtn').textContent='⏸ Pause';ui();last=performance.now()}
function choose(){choosing=true;jx=jy=0;E('choice').classList.add('show')}
document.querySelectorAll('.perk').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.p;if(powers[k]>=5)return;powers[k]++;cd[k]=0;round++;rt=0;fresh();addCop();choosing=false;E('choice').classList.remove('show');ui();flash(powers[k]===5?'✨ '+k.toUpperCase()+' EVOLVED!':'ROUND '+round)}));
function finish(w){ended=true;jx=jy=0;E('result').textContent=w?'ESCAPED!':'CAUGHT!';E('score').textContent=w?'You survived all 10 rounds.':'Reached round '+round;E('over').classList.add('show')}
function acquire(c){let alive=thieves.filter(t=>t.alive),cand=[...alive];if(vanish<=0)cand.push(player);if(!cand.length)return null;if(c.type==='H'&&c.target&&c.lock>0&&((c.target===player&&vanish<=0)||c.target.alive))return c.target;if(c.type==='H')return cand.reduce((a,b)=>D(c,a)<D(c,b)?a:b);let best=null,bs=-1e9;for(const t of cand){let cluster=alive.filter(o=>D(t,o)<120).length,score=cluster*85-D(c,t)-(t===player?20:0);if(score>bs){bs=score;best=t}}return best}
function powersTick(d){for(const k of ['friends','phase','slow'])if(powers[k])cd[k]+=d;if(powers.friends&&cd.friends>=(powers.friends>=5?15:5)){cd.friends=0;if(powers.friends>=5){friend(true);flash('☠️ SPECIAL FRIEND')}else{for(let i=0;i<powers.friends;i++)friend(false,i,powers.friends);flash('🧑‍🤝‍🧑 FRIENDS!')}}if(powers.phase&&cd.phase>=(powers.phase>=5?15:5)){cd.phase=0;if(powers.phase>=5){vanish=2;cops.forEach(c=>{if(c.target===player){c.target=null;c.lock=0}});flash('🫥 VANISH!')}else{phase=1.25+.35*(powers.phase-1);flash('👻 PHASE')}}if(powers.slow&&cd.slow>=(powers.slow>=5?15:3)){cd.slow=0;let rad=powers.slow>=5?150:110+25*(powers.slow-1);pulse=.4;cops.forEach(c=>{if(c.alive&&D(c,player)<rad){if(powers.slow>=5)c.freeze=2;else c.slow=1.5+.25*(powers.slow-1)}});flash(powers.slow>=5?'❄️ FREEZE!':'🌀 SLOW')}}
function update(d){if(ended||paused||choosing)return;rt+=d;let total=(round-1)*20+rt;E('time').textContent=Math.floor(total/60)+':'+String(Math.floor(total%60)).padStart(2,'0');if(rt>=20){if(round>=10)return finish(true);return choose()}phase=Math.max(0,phase-d);vanish=Math.max(0,vanish-d);pulse=Math.max(0,pulse-d);invuln=Math.max(0,invuln-d);powersTick(d);let jm=Math.hypot(jx,jy);if(jm>.04)move(player,jx/jm*player.s,jy/jm*player.s,d,phase>0);
for(const t of thieves){if(!t.alive)continue;t.grace=Math.max(0,(t.grace||0)-d);if(t.kind==='normal'){let c=nearestCop(t.x,t.y);if(c){let dx=t.x-c.x,dy=t.y-c.y;steer(t,{x:t.x+dx,y:t.y+dy},t.s,d)}}else if(t.kind==='friend'){steer(t,{x:t.x+Math.cos(t.angle)*500,y:t.y+Math.sin(t.angle)*500},t.s,d);if(hit(t.x+Math.cos(t.angle)*18,t.y+Math.sin(t.angle)*18,t.r))t.angle+=Math.PI/2+(Math.random()-.5)}else{if(!t.target||!t.target.alive)t.target=nearestCop(t.x,t.y);if(t.target)steer(t,t.target,t.s,d)}}
for(const c of cops){if(!c.alive)continue;c.lock-=d;c.rageClock+=d;c.freeze=Math.max(0,c.freeze-d);c.slow=Math.max(0,c.slow-d);c.rage=Math.max(0,c.rage-d);if(c.type==='B'&&c.rage<=0&&c.rageClock>=9){c.rageClock=0;c.rage=5;flash('😡 BERSERKER!')}if(c.freeze>0)continue;if(!c.target||c.lock<=0||(c.target!==player&&!c.target.alive)||(c.target===player&&vanish>0)){c.target=acquire(c);c.lock=c.type==='H'?7:3}if(c.target){let tx=c.target.x,ty=c.target.y,dx=tx-c.x,dy=ty-c.y,m=Math.hypot(dx,dy)||1;if(c.type==='A'&&c.target===player&&jm>.05){tx+=jx/jm*90;ty+=jy/jm*90}let speed=c.s*(c.rage>0?1.1:1)*(c.slow>0?.58:1);steer(c,{x:tx-dy/m*c.flank,y:ty+dx/m*c.flank},speed,d,c.type==='B'&&c.rage>0)}if(vanish<=0&&invuln<=0&&D(c,player)<c.r+player.r){pwr(c,5);lives--;ui();if(lives<=0)return finish(false);let p=spot(c,220);player.x=p.x;player.y=p.y;invuln=1.25;c.target=null;flash('💔 '+lives+' LIVES LEFT')}for(const t of thieves){if(!t.alive||t.grace>0)continue;if(D(c,t)<c.r+t.r){if(t.kind==='special'){t.alive=false;c.alive=false;count();flash('☠️ POLICE REMOVED!');break}else{t.alive=false;pwr(c);if(c.target===t)c.target=null}}}}
for(const k of ['friends','phase','slow']){let lim=k==='friends'?(powers[k]>=5?15:5):k==='phase'?(powers[k]>=5?15:5):(powers[k]>=5?15:3);E(k+'Bar').style.width=(powers[k]?Math.min(100,cd[k]/lim*100):0)+'%'}}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#dce8cd';g.fillRect(0,0,W,H);g.fillStyle='#d1c4a5';g.fillRect(0,245,W,48);g.fillRect(315,0,50,H);g.fillStyle='#727879';walls.forEach(o=>g.fillRect(o.x,o.y,o.w,o.h));if(pulse){g.strokeStyle='#6f8fb7';g.lineWidth=6;g.beginPath();g.arc(player.x,player.y,powers.slow>=5?150:110+25*(Math.max(1,powers.slow)-1),0,Math.PI*2);g.stroke()}function dot(e,col,ch,a=1){g.save();g.globalAlpha=a;g.fillStyle=col;g.beginPath();g.arc(e.x,e.y,e.r,0,Math.PI*2);g.fill();g.fillStyle='white';g.font='bold 12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,e.x,e.y);g.restore()}thieves.forEach(t=>t.alive&&dot(t,t.kind==='special'?'#202020':t.kind==='friend'?'#e2773d':'#df4b4b',t.kind==='special'?'☠':t.kind==='friend'?'F':'T'));cops.forEach(c=>c.alive&&dot(c,c.freeze>0?'#75b9dd':c.rage>0?'#8b2fc2':'#3979d8',c.type));dot(player,'#e6b91e','★',vanish>0?.12:phase>0?.42:invuln>0?.65:1)}
function loop(n){let d=Math.min((n-last)/1000,.035);last=n;update(d);draw();requestAnimationFrame(loop)}function togglePause(){if(ended||choosing)return;paused=!paused;jx=jy=0;E('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause';E('pauseScreen').classList.toggle('show',paused)}E('pauseBtn').addEventListener('click',togglePause);E('restart').addEventListener('click',reset);E('again').addEventListener('click',reset);
const joy=E('joy'),base=E('base'),knob=E('knob');function joyMove(e){if(e.pointerId!==pointer)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-origin.x,dy=e.clientY-r.top-origin.y,m=Math.hypot(dx,dy)||1,k=Math.min(38,m);jx=dx/m*Math.min(1,m/38);jy=dy/m*Math.min(1,m/38);knob.style.left=32+dx/m*k+'px';knob.style.top=32+dy/m*k+'px'}joy.addEventListener('pointerdown',e=>{if(pointer!==null||paused||choosing)return;pointer=e.pointerId;joy.setPointerCapture(pointer);let r=joy.getBoundingClientRect();origin={x:e.clientX-r.left,y:e.clientY-r.top};base.style.left=origin.x+'px';base.style.top=origin.y+'px';base.style.display='block';joyMove(e)});joy.addEventListener('pointermove',joyMove);function release(e){if(e.pointerId!==pointer)return;pointer=null;jx=jy=0;base.style.display='none';knob.style.left=knob.style.top='32px'}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);reset();requestAnimationFrame(n=>{last=n;requestAnimationFrame(loop)})})();
</script></body></html>
