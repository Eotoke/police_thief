<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Police & Thief v0.5.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f4efe4;color:#222;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center}#app{width:min(100%,760px);padding:10px}.title{text-align:center;font-weight:950;font-size:20px;margin-bottom:7px}.title small{font-size:13px;opacity:.6}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:800}button{border:0;border-radius:12px;background:#222;color:#fff;padding:10px 14px;font-weight:850}.stage{position:relative;margin-top:8px}canvas{display:block;width:100%;aspect-ratio:4/3;background:#dce8cd;border:2px solid #333;border-radius:15px}.banner{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#222;color:white;border-radius:99px;padding:9px 15px;font-weight:900;white-space:nowrap}.over{display:none;position:absolute;inset:0;background:#0009;border-radius:15px;color:white;align-items:center;justify-content:center;text-align:center;padding:20px}.over.show{display:flex}.result{font-size:27px;font-weight:950}.hint{text-align:center;color:#6d675e;font-size:13px;margin:8px}.legend{text-align:center;color:#68625a;font-size:12px;margin:7px}.joy{height:170px;border:2px dashed #b7aa94;border-radius:20px;position:relative;touch-action:none;overflow:hidden;user-select:none}.joylabel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c806d;font-weight:800;pointer-events:none}.base{display:none;position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid #7778;background:#fff6;transform:translate(-50%,-50%);pointer-events:none}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#222;left:32px;top:32px}
</style></head><body><div id="app">
<div class="title">POLICE &amp; THIEF <small>v0.5.1</small></div>
<div class="top"><span>❤️ <b id="lives">3</b> · ⏱ <b id="time">0:00</b></span><button id="restart">Restart</button><span>ROUND <b id="round">1</b>/10 · 🚓 <b id="copCount">1</b></span></div>
<div class="stage"><canvas id="game" width="720" height="540"></canvas><div id="banner" class="banner"></div><div id="over" class="over"><div><div id="result" class="result"></div><div id="score"></div><button id="again" style="margin-top:14px;background:white;color:#111">Run again</button></div></div></div>
<div class="legend">★ You · 🔴 Thief · H Hunter · A Ambusher · B Berserker</div>
<div class="hint">Touch anywhere below and drag with one thumb.</div>
<div id="joy" class="joy"><div class="joylabel">DRAG TO RUN<br>360° CONTROL</div><div id="base" class="base"><div id="knob" class="knob"></div></div></div>
<script>
(()=>{const C=document.querySelector('#game'),g=C.getContext('2d'),W=C.width,H=C.height,E=id=>document.getElementById(id),time=E('time'),roundEl=E('round'),livesEl=E('lives'),copCount=E('copCount'),banner=E('banner'),over=E('over'),result=E('result'),score=E('score');
const walls=[{x:130,y:90,w:145,h:32},{x:430,y:70,w:34,h:165},{x:220,y:285,w:205,h:34},{x:550,y:355,w:110,h:32},{x:65,y:390,w:36,h:105}];
let player,cops,thieves,start,last,round,lives,ended=false,jx=0,jy=0,pointer=null,origin={x:0,y:0};
const hit=(x,y,r=12)=>x<18+r||x>W-18-r||y<18+r||y>H-18-r||walls.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
function move(e,vx,vy,dt,ghost=false){let nx=e.x+vx*dt,ny=e.y+vy*dt;if(ghost){e.x=Math.max(20,Math.min(W-20,nx));e.y=Math.max(20,Math.min(H-20,ny));return}if(!hit(nx,e.y,e.r))e.x=nx;if(!hit(e.x,ny,e.r))e.y=ny}
function spot(away,min=0){for(let i=0;i<400;i++){let p={x:35+Math.random()*(W-70),y:35+Math.random()*(H-70)};if(!hit(p.x,p.y,14)&&(!away||Math.hypot(p.x-away.x,p.y-away.y)>min))return p}return{x:40,y:40}}
function freshThieves(){thieves=[];for(let i=0;i<5;i++){let p=spot(player,70);thieves.push({x:p.x,y:p.y,r:11,s:125+i*2,alive:true,phase:i*1.17})}}
function addCop(){let types=['HUNTER','AMBUSHER','BERSERKER'],type=types[cops.length%3],p=spot(player,210);cops.push({x:p.x,y:p.y,r:13,s:108,type,tar:null,lock:0,flank:(cops.length%2?1:-1)*(70+25*(cops.length%3)),rage:0,rageClock:0,shake:0,catches:0});copCount.textContent=cops.length}
function reset(){player={x:80,y:70,r:12,s:205};cops=[];round=1;lives=3;ended=false;start=performance.now();last=start;jx=jy=0;roundEl.textContent=1;livesEl.textContent=3;over.classList.remove('show');freshThieves();addCop()}
function steer(e,q,s,dt,ghost=false){let dx=q.x-e.x,dy=q.y-e.y,m=Math.hypot(dx,dy)||1,px=e.x,py=e.y;move(e,dx/m*s,dy/m*s,dt,ghost);if(!ghost&&Math.hypot(e.x-px,e.y-py)<.5){let side=((e.x+e.y)%2>.8)?1:-1;move(e,-dy/m*s*side,dx/m*s*side,dt)}}
function flash(txt){banner.textContent=txt;banner.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>banner.style.display='none',1100)}
function power(c,mult=1){c.s+=2.5*mult;c.r=Math.min(26,c.r+.45*mult)}
function end(win){ended=true;result.textContent=win?'ESCAPED!':'CAUGHT!';score.textContent=win?'You survived all 10 rounds.':'Survived '+time.textContent+' · Reached round '+round;over.classList.add('show')}
function update(dt,now){if(ended)return;let sec=(now-start)/1000,newRound=1+Math.floor(sec/20);if(newRound>10){end(true);return}while(round<newRound){round++;roundEl.textContent=round;freshThieves();addCop();flash('ROUND '+round+' · FRESH THIEVES · NEW POLICE')}
time.textContent=Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');let jm=Math.hypot(jx,jy);if(jm>.04)move(player,jx/jm*player.s,jy/jm*player.s,dt);
for(const t of thieves)if(t.alive){t.phase+=dt;let c=cops.reduce((a,b)=>Math.hypot(t.x-a.x,t.y-a.y)<Math.hypot(t.x-b.x,t.y-b.y)?a:b),dx=t.x-c.x,dy=t.y-c.y,m=Math.hypot(dx,dy)||1;if(Math.sin(t.phase*.7)>.82&&m<190){dx=player.x-t.x;dy=player.y-t.y}steer(t,{x:t.x+dx,y:t.y+dy},t.s,dt)}
for(const c of cops){c.lock-=dt;c.rageClock+=dt;if(c.rage>0)c.rage-=dt;if(c.type==='BERSERKER'&&c.rage<=0&&c.rageClock>=9){c.rageClock=0;c.shake=2;c.rage=5;flash('😡 BERSERKER ENRAGED')}if(c.shake>0)c.shake-=dt;
let qs=[player,...thieves.filter(t=>t.alive)],nearest=qs.reduce((a,b)=>Math.hypot(c.x-a.x,c.y-a.y)<Math.hypot(c.x-b.x,c.y-b.y)?a:b);if(!c.tar||!qs.includes(c.tar)||c.lock<=0){c.tar=nearest;c.lock=c.type==='HUNTER'?7:2.4}
let tx=c.tar.x,ty=c.tar.y,dx=tx-c.x,dy=ty-c.y,m=Math.hypot(dx,dy)||1,side=c.flank;if(c.type==='AMBUSHER'&&c.tar===player&&jm>.05){tx+=jx/jm*95;ty+=jy/jm*95;side*=1.25}let aim={x:tx-dy/m*side,y:ty+dx/m*side};steer(c,aim,c.s*(c.rage>0?1.1:1),dt,c.type==='BERSERKER'&&c.rage>0);
if(Math.hypot(c.x-player.x,c.y-player.y)<c.r+player.r){power(c,5);lives--;livesEl.textContent=lives;if(lives<=0){end(false);return}let p=spot(c,230);player.x=p.x;player.y=p.y;c.tar=null;flash('💔 '+lives+' LIVES LEFT · '+c.type+' POWERED UP')}
for(const t of thieves)if(t.alive&&Math.hypot(c.x-t.x,c.y-t.y)<c.r+t.r){t.alive=false;c.catches++;power(c)}}}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#dce8cd';g.fillRect(0,0,W,H);g.fillStyle='#d1c4a5';g.fillRect(0,245,W,48);g.fillRect(315,0,50,H);g.fillStyle='#727879';walls.forEach(o=>g.fillRect(o.x,o.y,o.w,o.h));function dot(e,col,ch,shake=0){g.save();if(shake>0)g.translate((Math.random()-.5)*6,(Math.random()-.5)*6);g.fillStyle=col;g.beginPath();g.arc(e.x,e.y,e.r,0,Math.PI*2);g.fill();g.fillStyle='white';g.font='bold 12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,e.x,e.y);g.restore()}thieves.forEach(t=>{if(t.alive)dot(t,'#df4b4b','T')});cops.forEach(c=>dot(c,c.rage>0?'#8b2fc2':'#3979d8',c.type==='HUNTER'?'H':c.type==='AMBUSHER'?'A':'B',c.shake));dot(player,'#e6b91e','★')}
function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;update(dt,now);draw();requestAnimationFrame(loop)}
const joy=E('joy'),base=E('base'),knob=E('knob');function joyMove(e){if(e.pointerId!==pointer)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-origin.x,dy=e.clientY-r.top-origin.y,m=Math.hypot(dx,dy)||1,k=Math.min(38,m),ux=dx/m,uy=dy/m;knob.style.left=(32+ux*k)+'px';knob.style.top=(32+uy*k)+'px';jx=ux*Math.min(1,m/38);jy=uy*Math.min(1,m/38)}
joy.addEventListener('pointerdown',e=>{if(pointer!==null)return;pointer=e.pointerId;joy.setPointerCapture(pointer);let r=joy.getBoundingClientRect();origin={x:e.clientX-r.left,y:e.clientY-r.top};base.style.left=origin.x+'px';base.style.top=origin.y+'px';base.style.display='block';joyMove(e)});joy.addEventListener('pointermove',joyMove);function release(e){if(e.pointerId!==pointer)return;pointer=null;jx=jy=0;base.style.display='none';knob.style.left=knob.style.top='32px'}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);E('restart').onclick=reset;E('again').onclick=reset;reset();requestAnimationFrame(n=>{last=n;requestAnimationFrame(loop)})})();
</script></div></body></html>
