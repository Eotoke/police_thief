<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Police & Thief v0.6</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4efe4;font-family:system-ui;color:#222}#a{max-width:760px;margin:auto;padding:10px}.title{text-align:center;font-weight:900;font-size:20px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}button{border:0;border-radius:11px;padding:10px;font-weight:800}.stage{position:relative;margin-top:8px}canvas{width:100%;aspect-ratio:4/3;background:#dce8cd;border:2px solid #333;border-radius:14px;display:block}.choice,.over{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:12px}.show{display:flex}.box{background:#f8f5ee;border-radius:16px;padding:14px;text-align:center}.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.perk{background:white;border:1px solid #aaa}.banner{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:8px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.p{text-align:center;border:1px solid #bbb;border-radius:8px;padding:6px;font-size:11px}.bar{height:4px;background:#ccc}.fill{display:block;height:100%;background:#555;width:0}.joy{height:160px;border:2px dashed #aaa;border-radius:18px;position:relative;touch-action:none}.lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#777;font-weight:800}.base{display:none;position:absolute;width:112px;height:112px;border:2px solid #8888;border-radius:50%;background:#fff6;transform:translate(-50%,-50%)}.knob{position:absolute;width:48px;height:48px;background:#222;border-radius:50%;left:32px;top:32px}</style>
<div id="a"><div class="title">POLICE & THIEF <small>v0.6</small></div><div class="top"><span>❤️ <b id="li">3</b> · ⏱ <b id="tm">0:00</b></span><button id="re">Restart</button><span>ROUND <b id="rd">1</b>/10 · 🚓 <b id="nc">1</b></span></div><div class="stage"><canvas id="c" width="720" height="540"></canvas><div id="bn" class="banner"></div><div id="ch" class="choice"><div class="box"><b>ROUND CLEARED ✨</b><p>Choose a power. Choosing it again levels it up.</p><div class="perks"><button class="perk" data-p="f">🧑‍🤝‍🧑<br><b>Call Friends</b><br>Every 5s<br>Lv <i id="fl">0</i></button><button class="perk" data-p="p">👻<br><b>Phase</b><br>Every 5s<br>Lv <i id="pl">0</i></button><button class="perk" data-p="s">🌀<br><b>Slow Field</b><br>Every 3s<br>Lv <i id="sl">0</i></button></div></div></div><div id="ov" class="over"><div class="box"><b id="res"></b><p id="score"></p><button id="ag">Run again</button></div></div></div><div class="status"><div class="p">🧑‍🤝‍🧑 <b id="fs">Lv0</b><div class="bar"><i id="fb" class="fill"></i></div></div><div class="p">👻 <b id="ps">Lv0</b><div class="bar"><i id="pb" class="fill"></i></div></div><div class="p">🌀 <b id="ss">Lv0</b><div class="bar"><i id="sb" class="fill"></i></div></div></div><div style="text-align:center;font-size:12px">★ You · T Thief · H Hunter · A Ambusher · B Berserker</div><div id="joy" class="joy"><div class="lab">DRAG TO RUN<br>360° CONTROL</div><div id="base" class="base"><div id="knob" class="knob"></div></div></div></div>
<script>
(()=>{const E=x=>document.getElementById(x),c=E('c'),g=c.getContext('2d'),W=720,H=540,O=[{x:130,y:90,w:145,h:32},{x:430,y:70,w:34,h:165},{x:220,y:285,w:205,h:34},{x:550,y:355,w:110,h:32},{x:65,y:390,w:36,h:105}];let me,cops,ts,t0,last,R,L,end,pause,jx=0,jy=0,pid=null,org={},pow,cd,phase=0,pulse=0;
const hit=(x,y,r=12)=>x<30||x>W-30||y<30||y>H-30||O.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
function mv(e,vx,vy,d,ghost=0){let X=e.x+vx*d,Y=e.y+vy*d;if(ghost){e.x=Math.max(22,Math.min(W-22,X));e.y=Math.max(22,Math.min(H-22,Y))}else{if(!hit(X,e.y,e.r))e.x=X;if(!hit(e.x,Y,e.r))e.y=Y}}
function spot(a,m=0){for(let i=0;i<300;i++){let p={x:40+Math.random()*640,y:40+Math.random()*460};if(!hit(p.x,p.y)&&(!a||Math.hypot(p.x-a.x,p.y-a.y)>m))return p}return{x:50,y:50}}
function thief(near=0){let p=near?{x:me.x+(Math.random()-.5)*90,y:me.y+(Math.random()-.5)*90}:spot(me,50);if(hit(p.x,p.y))p=spot();ts.push({x:p.x,y:p.y,r:11,s:126+Math.random()*8,on:1,k:Math.random()*7})}function fresh(){ts=[];for(let i=0;i<5;i++)thief()}
function cop(){let type=['H','A','B'][cops.length%3],p=spot(me,200);cops.push({x:p.x,y:p.y,r:13,s:108,type,tar:null,lock:0,side:(cops.length%2?1:-1)*(70+25*(cops.length%3)),rage:0,clock:0,slow:0});E('nc').textContent=cops.length}
function steer(e,q,s,d,ghost=0){let x=q.x-e.x,y=q.y-e.y,m=Math.hypot(x,y)||1,px=e.x,py=e.y;mv(e,x/m*s,y/m*s,d,ghost);if(!ghost&&Math.hypot(e.x-px,e.y-py)<.5)mv(e,-y/m*s,x/m*s,d)}
function flash(t){E('bn').textContent=t;E('bn').style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>E('bn').style.display='none',850)}
function ui(){E('li').textContent=L;E('rd').textContent=R;for(const [a,b] of [['f','f'],['p','p'],['s','s']]){E(a+'l').textContent=pow[a];E(a+'s').textContent='Lv'+pow[a]}}
function reset(){me={x:80,y:70,r:12,s:205};cops=[];R=1;L=3;end=pause=0;pow={f:0,p:0,s:0};cd={f:0,p:0,s:0};phase=pulse=0;t0=last=performance.now();fresh();cop();E('ov').classList.remove('show');E('ch').classList.remove('show');ui()}
document.querySelectorAll('.perk').forEach(b=>b.onclick=()=>{pow[b.dataset.p]++;cd[b.dataset.p]=0;R++;fresh();cop();pause=0;E('ch').classList.remove('show');ui();flash('ROUND '+R+' · POWER UP!')});
function finish(w){end=1;E('res').textContent=w?'ESCAPED!':'CAUGHT!';E('score').textContent=w?'You survived all 10 rounds.':'Reached round '+R;E('ov').classList.add('show')}
function update(d,n){if(end||pause)return;let elapsed=(n-t0)/1000,Eround=elapsed-(R-1)*20;E('tm').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');if(Eround>=20){if(R>=10)return finish(1);pause=1;E('ch').classList.add('show');return}let jm=Math.hypot(jx,jy);phase=Math.max(0,phase-d);pulse=Math.max(0,pulse-d);if(jm>.04)mv(me,jx/jm*me.s,jy/jm*me.s,d,phase>0);
for(const k of ['f','p','s'])if(pow[k])cd[k]+=d;if(pow.f&&cd.f>=5){cd.f=0;for(let i=0;i<pow.f;i++)thief(1);flash('🧑‍🤝‍🧑 FRIENDS ARRIVE!')}if(pow.p&&cd.p>=5){cd.p=0;phase=1.25+.35*(pow.p-1);flash('👻 PHASE')}if(pow.s&&cd.s>=3){cd.s=0;pulse=.45;let r=110+25*(pow.s-1);cops.forEach(q=>{if(Math.hypot(q.x-me.x,q.y-me.y)<r)q.slow=1.5+.25*(pow.s-1)});flash('🌀 SLOW FIELD')}
for(const t of ts)if(t.on){let q=cops.reduce((a,b)=>Math.hypot(t.x-a.x,t.y-a.y)<Math.hypot(t.x-b.x,t.y-b.y)?a:b),x=t.x-q.x,y=t.y-q.y;steer(t,{x:t.x+x,y:t.y+y},t.s,d)}
for(const q of cops){q.lock-=d;q.clock+=d;q.slow=Math.max(0,q.slow-d);q.rage=Math.max(0,q.rage-d);if(q.type==='B'&&q.clock>=9){q.clock=0;q.rage=5;flash('😡 BERSERKER ENRAGED')}let qs=[me,...ts.filter(t=>t.on)],near=qs.reduce((a,b)=>Math.hypot(q.x-a.x,q.y-a.y)<Math.hypot(q.x-b.x,q.y-b.y)?a:b);if(!q.tar||!qs.includes(q.tar)||q.lock<=0){q.tar=near;q.lock=q.type==='H'?7:2.4}let tx=q.tar.x,ty=q.tar.y,x=tx-q.x,y=ty-q.y,m=Math.hypot(x,y)||1;if(q.type==='A'&&q.tar===me&&jm>.05){tx+=jx/jm*95;ty+=jy/jm*95}steer(q,{x:tx-y/m*q.side,y:ty+x/m*q.side},q.s*(q.rage?1.1:1)*(q.slow?.58:1),d,q.type==='B'&&q.rage);if(Math.hypot(q.x-me.x,q.y-me.y)<q.r+me.r){q.s+=12.5;q.r=Math.min(26,q.r+2.25);L--;ui();if(L<=0)return finish(0);let p=spot(q,220);me.x=p.x;me.y=p.y;q.tar=null;flash('💔 '+L+' LIVES LEFT')}for(const t of ts)if(t.on&&Math.hypot(q.x-t.x,q.y-t.y)<q.r+t.r){t.on=0;q.s+=2.5;q.r=Math.min(26,q.r+.45)}}E('fb').style.width=pow.f?cd.f/5*100+'%':'0';E('pb').style.width=pow.p?cd.p/5*100+'%':'0';E('sb').style.width=pow.s?cd.s/3*100+'%':'0'}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#dce8cd';g.fillRect(0,0,W,H);g.fillStyle='#d1c4a5';g.fillRect(0,245,W,48);g.fillRect(315,0,50,H);g.fillStyle='#777';O.forEach(o=>g.fillRect(o.x,o.y,o.w,o.h));if(pulse){g.strokeStyle='#7562c9';g.lineWidth=5;g.beginPath();g.arc(me.x,me.y,130,0,7);g.stroke()}function dot(e,col,ch){g.globalAlpha=e===me&&phase?.4:1;g.fillStyle=col;g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='white';g.font='bold 12px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,e.x,e.y);g.globalAlpha=1}ts.forEach(t=>t.on&&dot(t,'#df4b4b','T'));cops.forEach(q=>dot(q,q.rage?'#8b2fc2':'#3979d8',q.type));dot(me,'#e6b91e','★')}
function loop(n){let d=Math.min((n-last)/1000,.035);last=n;update(d,n);draw();requestAnimationFrame(loop)}const joy=E('joy'),base=E('base'),knob=E('knob');function jmove(e){if(e.pointerId!==pid)return;let r=joy.getBoundingClientRect(),x=e.clientX-r.left-org.x,y=e.clientY-r.top-org.y,m=Math.hypot(x,y)||1,k=Math.min(38,m),ux=x/m,uy=y/m;knob.style.left=32+ux*k+'px';knob.style.top=32+uy*k+'px';jx=ux*Math.min(1,m/38);jy=uy*Math.min(1,m/38)}joy.onpointerdown=e=>{if(pid!==null||pause)return;pid=e.pointerId;joy.setPointerCapture(pid);let r=joy.getBoundingClientRect();org={x:e.clientX-r.left,y:e.clientY-r.top};base.style.left=org.x+'px';base.style.top=org.y+'px';base.style.display='block';jmove(e)};joy.onpointermove=jmove;function rel(e){if(e.pointerId!==pid)return;pid=null;jx=jy=0;base.style.display='none'}joy.onpointerup=joy.onpointercancel=rel;E('re').onclick=E('ag').onclick=reset;reset();requestAnimationFrame(n=>{last=n;requestAnimationFrame(loop)})})();
</script>
