<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Police & Thief v0.5</title>
<style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#f3efe5;font-family:system-ui;color:#222}#a{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}button{padding:10px 14px;border:0;border-radius:12px;background:#222;color:white;font-weight:800}canvas{width:100%;aspect-ratio:4/3;background:#dce8cd;border:3px solid #222;border-radius:16px;display:block;margin-top:8px}.hint{text-align:center;font-size:13px;margin:8px;color:#666}#joy{height:180px;border:2px dashed #b7aa94;border-radius:20px;position:relative;touch-action:none;overflow:hidden}.lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c806d;font-weight:800}.base{display:none;position:absolute;width:116px;height:116px;border-radius:50%;border:3px solid #9998;background:#fff6;transform:translate(-50%,-50%)}.knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#222;left:31px;top:31px}.banner{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#222;color:white;border-radius:99px;padding:10px 16px;font-weight:900;display:none;white-space:nowrap}.stage{position:relative}.over{display:none;position:absolute;inset:8px 0 0;background:#0009;border-radius:16px;color:#fff;place-items:center;text-align:center;font-size:25px;font-weight:900}</style></head>
<body><div id="a"><div style="text-align:center;font-weight:950;font-size:20px;margin-bottom:7px">POLICE & THIEF <span style="font-size:13px;opacity:.62">v0.5</span></div><div class="top"><span>❤️ <b id="life">3</b> · ⏱ <b id="tm">0:00</b></span><button id="re">Restart</button><span>ROUND <b id="lv">1</b>/10 · 🚓 <b id="np">1</b></span></div><div class="stage"><canvas id="c" width="800" height="600"></canvas><div id="bn" class="banner"></div><div id="ov" class="over"><div>CAUGHT!<br><small id="sc"></small><br><button id="ag">Run again</button></div></div></div><div class="hint">Touch anywhere below and drag. Your thumb becomes the joystick.</div><div id="joy"><div class="lab">DRAG TO RUN<br>360° CONTROL</div><div id="bs" class="base"><div id="kb" class="knob"></div></div></div></div>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),W=800,H=600;const tm=document.querySelector('#tm'),lv=document.querySelector('#lv'),np=document.querySelector('#np'),lifeEl=document.querySelector('#life'),bn=document.querySelector('#bn'),ov=document.querySelector('#ov'),sc=document.querySelector('#sc');const joy=document.querySelector('#joy'),bs=document.querySelector('#bs'),kb=document.querySelector('#kb');
const O=[{x:150,y:110,w:160,h:35},{x:480,y:80,w:38,h:190},{x:240,y:315,w:230,h:38},{x:610,y:390,w:120,h:35},{x:80,y:430,w:42,h:115}];let me,cops,thieves,t0,last,L,dead,lives,won=false,jx=0,jy=0,pid=null,ox=0,oy=0;
function hit(x,y,r=14){if(x<22||x>W-22||y<22||y>H-22)return 1;return O.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function spot(away){for(let i=0;i<500;i++){let p={x:40+Math.random()*720,y:40+Math.random()*520};if(!hit(p.x,p.y)&&(!away||Math.hypot(p.x-away.x,p.y-away.y)>240))return p}return{x:50,y:550}}
function mv(e,vx,vy,d){let nx=e.x+vx*d,ny=e.y+vy*d;if(!hit(nx,e.y))e.x=nx;if(!hit(e.x,ny))e.y=ny}
function chase(e,q,s,d){let dx=q.x-e.x,dy=q.y-e.y,m=Math.hypot(dx,dy)||1,ax=dx/m,ay=dy/m,px=e.x,py=e.y;
if(e.type==='BERSERKER'&&e.rage>0){e.x=Math.max(22,Math.min(W-22,e.x+ax*s*d));e.y=Math.max(22,Math.min(H-22,e.y+ay*s*d));}
else mv(e,ax*s,ay*s,d);if(Math.hypot(e.x-px,e.y-py)<1){let side=Math.random()<.5?1:-1;mv(e,-ay*s*side,ax*s*side,d)}}
function addCop(){let p=spot(me);(()=>{let types=['HUNTER','AMBUSHER','BERSERKER'],type=types[cops.length%types.length];
cops.push({x:p.x,y:p.y,s:116,r:14,tar:null,lock:0,flank:(Math.random()*2-1)*150,curve:Math.random()*6.28,catches:0,type:type,rage:0,rageCharge:0})})()}
function reset(){me={x:100,y:90};cops=[];thieves=[];L=1;lives=3;won=false;dead=false;lifeEl.textContent=lives;t0=performance.now();last=t0;for(let i=0;i<5;i++){let p=spot();thieves.push({x:p.x,y:p.y,s:135+Math.random()*15,alive:true,k:Math.random()*7})}addCop();lv.textContent=L;np.textContent=1;ov.style.display='none';ov.firstElementChild.firstChild.textContent='CAUGHT!'}
function update(d,n){if(dead)return;let sec=(n-t0)/1000,newL=1+Math.floor(sec/20);if(newL>10){won=true;dead=true;sc.textContent='YOU SURVIVED ALL 10 ROUNDS! · '+tm.textContent;ov.firstElementChild.firstChild.textContent='ESCAPED!';ov.style.display='grid';return}
while(L<newL){
L++;
// Every level brings a fresh pack of thieves.
thieves=[];
for(let i=0;i<5;i++){let tp=spot();thieves.push({x:tp.x,y:tp.y,s:132+Math.random()*20,alive:true,k:Math.random()*7})}
addCop();lv.textContent=L;np.textContent=cops.length;bn.textContent='LEVEL '+L+' · FRESH THIEVES · NEW POLICE!';bn.style.display='block';setTimeout(()=>bn.style.display='none',1100)}tm.textContent=Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');let m=Math.hypot(jx,jy);if(m>.05)mv(me,jx/m*220,jy/m*220,d);
for(const t of thieves)if(t.alive){t.k+=d;let cc=cops.reduce((a,b)=>Math.hypot(t.x-a.x,t.y-a.y)<Math.hypot(t.x-b.x,t.y-b.y)?a:b);let dx=t.x-cc.x,dy=t.y-cc.y;if(Math.sin(t.k*.8)>.82&&Math.hypot(dx,dy)<230){dx=me.x-t.x;dy=me.y-t.y}chase(t,{x:t.x+dx,y:t.y+dy},t.s,d)}
for(const p of cops){
p.lock-=d;if(p.rage>0)p.rage-=d;
let qs=[me,...thieves.filter(t=>t.alive)],q=qs.reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<Math.hypot(p.x-b.x,p.y-b.y)?a:b);

// HUNTER: once committed, hangs on much longer. AMBUSHER: aims ahead of moving player.
// BERSERKER: periodically gets angry, shakes for 2 sec, then ignores obstacles for 3 sec.
if(!p.tar||p.lock<=0||!qs.includes(p.tar)){
 p.tar=q;
 p.lock=p.type==='HUNTER'?7:2.5;
}
p.curve+=d;
if(p.type==='BERSERKER'&&p.rage<=0){
 p.rageCharge+=d;
 if(p.rageCharge>9){p.rageCharge=0;p.rage=5;bn.textContent='😡 BERSERKER IS ENRAGED!';bn.style.display='block';setTimeout(()=>bn.style.display='none',900)}
}
let tx=p.tar.x,ty=p.tar.y,dx=tx-p.x,dy=ty-p.y,dm=Math.hypot(dx,dy)||1;
let side=p.flank*(0.72+0.28*Math.sin(p.curve*.7));
if(p.type==='AMBUSHER'&&p.tar===me){
 let jm=Math.hypot(jx,jy);if(jm>.08){tx+=jx/jm*115;ty+=jy/jm*115}
 side*=1.35;
}
let aim={x:tx+(-dy/dm)*side,y:ty+(dx/dm)*side};
chase(p,aim,p.s*(p.rage>0?1.10:1),d);

if(Math.hypot(p.x-me.x,p.y-me.y)<(p.r||14)+14){
 // Catching the player gives five normal fixed upgrades.
 p.s+=15;p.r=Math.min(27,(p.r||14)+2.5);
 lives--;lifeEl.textContent=lives;
 if(lives<=0){dead=true;sc.textContent='Survived '+tm.textContent+' · Round '+L;ov.style.display='grid'}
 else{
   let rp=spot();me.x=rp.x;me.y=rp.y;
   p.tar=null;p.lock=0;
   bn.textContent='💔 CAUGHT! '+lives+' LIVES LEFT · '+p.type+' POWERED UP';
   bn.style.display='block';setTimeout(()=>bn.style.display='none',1200);
 }
}
for(const t of thieves)if(t.alive&&Math.hypot(p.x-t.x,p.y-t.y)<(p.r||14)+13){
 t.alive=false;
 // Fixed catch upgrade: +3 speed and +0.5 radius.
 p.catches++;p.s+=3;p.r=Math.min(27,(p.r||14)+0.5);
}
}}}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#dce8cd';g.fillRect(0,0,W,H);g.fillStyle='#d3c5a5';g.fillRect(0,270,W,55);g.fillRect(350,0,55,H);g.fillStyle='#777';for(const o of O)g.fillRect(o.x,o.y,o.w,o.h);function dot(e,col,ch){g.save();if(e.rage>0){g.translate((Math.random()-.5)*7,(Math.random()-.5)*7);col='#8d2dca'}g.fillStyle=col;g.beginPath();g.arc(e.x,e.y,e.r||14,0,7);g.fill();g.fillStyle='white';g.font='bold 13px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,e.x,e.y);g.restore()}for(const t of thieves)if(t.alive)dot(t,'#df4b4b','T');for(const p of cops)dot(p,'#3979d8',p.type==='AMBUSHER'?'A':p.type==='BERSERKER'?'B':'H');dot(me,'#e7b91e','★')}
function loop(n){let d=Math.min((n-last)/1000,.035);last=n;update(d,n);draw();requestAnimationFrame(loop)}
joy.onpointerdown=e=>{if(pid!==null)return;pid=e.pointerId;joy.setPointerCapture(pid);let r=joy.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;bs.style.left=ox+'px';bs.style.top=oy+'px';bs.style.display='block';moveJoy(e)};
function moveJoy(e){if(e.pointerId!==pid)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-ox,dy=e.clientY-r.top-oy,m=Math.hypot(dx,dy)||1,k=Math.min(42,m),ux=dx/m,uy=dy/m;kb.style.left=(31+ux*k)+'px';kb.style.top=(31+uy*k)+'px';jx=ux*Math.min(1,m/42);jy=uy*Math.min(1,m/42)}
joy.onpointermove=moveJoy;function end(e){if(e.pointerId!==pid)return;pid=null;jx=jy=0;bs.style.display='none';kb.style.left=kb.style.top='31px'}joy.onpointerup=end;joy.onpointercancel=end;
document.querySelector('#re').onclick=reset;document.querySelector('#ag').onclick=reset;reset();requestAnimationFrame(n=>{last=n;requestAnimationFrame(loop)})})();
</script></body></html>
