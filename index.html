<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Police & Thief v0.3</title>
<style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#f3efe5;font-family:system-ui;color:#222}#a{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}button{padding:10px 14px;border:0;border-radius:12px;background:#222;color:white;font-weight:800}canvas{width:100%;aspect-ratio:4/3;background:#dce8cd;border:3px solid #222;border-radius:16px;display:block;margin-top:8px}.hint{text-align:center;font-size:13px;margin:8px;color:#666}#joy{height:180px;border:2px dashed #b7aa94;border-radius:20px;position:relative;touch-action:none;overflow:hidden}.lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c806d;font-weight:800}.base{display:none;position:absolute;width:116px;height:116px;border-radius:50%;border:3px solid #9998;background:#fff6;transform:translate(-50%,-50%)}.knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#222;left:31px;top:31px}.banner{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#222;color:white;border-radius:99px;padding:10px 16px;font-weight:900;display:none;white-space:nowrap}.stage{position:relative}.over{display:none;position:absolute;inset:8px 0 0;background:#0009;border-radius:16px;color:#fff;place-items:center;text-align:center;font-size:25px;font-weight:900}</style></head>
<body><div id="a"><div class="top"><span>⏱ <b id="tm">0:00</b></span><button id="re">Restart</button><span>LEVEL <b id="lv">1</b> · 🚓 <b id="np">1</b></span></div><div class="stage"><canvas id="c" width="800" height="600"></canvas><div id="bn" class="banner"></div><div id="ov" class="over"><div>CAUGHT!<br><small id="sc"></small><br><button id="ag">Run again</button></div></div></div><div class="hint">Touch anywhere below and drag. Your thumb becomes the joystick.</div><div id="joy"><div class="lab">DRAG TO RUN<br>360° CONTROL</div><div id="bs" class="base"><div id="kb" class="knob"></div></div></div></div>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),W=800,H=600;const tm=document.querySelector('#tm'),lv=document.querySelector('#lv'),np=document.querySelector('#np'),bn=document.querySelector('#bn'),ov=document.querySelector('#ov'),sc=document.querySelector('#sc');const joy=document.querySelector('#joy'),bs=document.querySelector('#bs'),kb=document.querySelector('#kb');
const O=[{x:150,y:110,w:160,h:35},{x:480,y:80,w:38,h:190},{x:240,y:315,w:230,h:38},{x:610,y:390,w:120,h:35},{x:80,y:430,w:42,h:115}];let me,cops,thieves,t0,last,L,dead,jx=0,jy=0,pid=null,ox=0,oy=0;
function hit(x,y,r=14){if(x<22||x>W-22||y<22||y>H-22)return 1;return O.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function spot(away){for(let i=0;i<500;i++){let p={x:40+Math.random()*720,y:40+Math.random()*520};if(!hit(p.x,p.y)&&(!away||Math.hypot(p.x-away.x,p.y-away.y)>240))return p}return{x:50,y:550}}
function mv(e,vx,vy,d){let nx=e.x+vx*d,ny=e.y+vy*d;if(!hit(nx,e.y))e.x=nx;if(!hit(e.x,ny))e.y=ny}
function chase(e,q,s,d){let dx=q.x-e.x,dy=q.y-e.y,m=Math.hypot(dx,dy)||1,ax=dx/m,ay=dy/m,px=e.x,py=e.y;mv(e,ax*s,ay*s,d);if(Math.hypot(e.x-px,e.y-py)<1){let side=Math.random()<.5?1:-1;mv(e,-ay*s*side,ax*s*side,d)}}
function addCop(){let p=spot(me);cops.push({x:p.x,y:p.y,s:114+Math.random()*13,tar:null,lock:0,flank:(Math.random()*2-1)*150,curve:Math.random()*6.28,catches:0})}
function reset(){me={x:100,y:90};cops=[];thieves=[];L=1;dead=false;t0=performance.now();last=t0;for(let i=0;i<5;i++){let p=spot();thieves.push({x:p.x,y:p.y,s:135+Math.random()*15,alive:true,k:Math.random()*7})}addCop();lv.textContent=L;np.textContent=1;ov.style.display='none'}
function update(d,n){if(dead)return;let sec=(n-t0)/1000,newL=1+Math.floor(sec/20);while(L<newL){
L++;
// Every level brings a fresh pack of thieves.
thieves=[];
for(let i=0;i<5;i++){let tp=spot();thieves.push({x:tp.x,y:tp.y,s:132+Math.random()*20,alive:true,k:Math.random()*7})}
addCop();lv.textContent=L;np.textContent=cops.length;bn.textContent='LEVEL '+L+' · FRESH THIEVES · NEW POLICE!';bn.style.display='block';setTimeout(()=>bn.style.display='none',1100)}tm.textContent=Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');let m=Math.hypot(jx,jy);if(m>.05)mv(me,jx/m*220,jy/m*220,d);
for(const t of thieves)if(t.alive){t.k+=d;let cc=cops.reduce((a,b)=>Math.hypot(t.x-a.x,t.y-a.y)<Math.hypot(t.x-b.x,t.y-b.y)?a:b);let dx=t.x-cc.x,dy=t.y-cc.y;if(Math.sin(t.k*.8)>.82&&Math.hypot(dx,dy)<230){dx=me.x-t.x;dy=me.y-t.y}chase(t,{x:t.x+dx,y:t.y+dy},t.s,d)}
for(const p of cops){p.lock-=d;let qs=[me,...thieves.filter(t=>t.alive)],q=qs.reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<Math.hypot(p.x-b.x,p.y-b.y)?a:b);if(!p.tar||p.lock<=0||!qs.includes(p.tar)){p.tar=q;p.lock=2+Math.random()*2;p.flank=(Math.random()*2-1)*150}
p.curve+=d;
// Each officer aims at a slightly different approach point around the target.
// The offset slowly breathes so the police don't collapse into one blob.
let tx=p.tar.x,ty=p.tar.y,dx=tx-p.x,dy=ty-p.y,dm=Math.hypot(dx,dy)||1;
let side=p.flank*(0.72+0.28*Math.sin(p.curve*.7));
let aim={x:tx+(-dy/dm)*side,y:ty+(dx/dm)*side};
chase(p,aim,p.s,d);
if(Math.hypot(p.x-me.x,p.y-me.y)<28){dead=true;sc.textContent='Survived '+tm.textContent+' · Level '+L;ov.style.display='grid'}
for(const t of thieves)if(t.alive&&Math.hypot(p.x-t.x,p.y-t.y)<27){
 t.alive=false;
 // Catcher perk: small permanent speed bump for this run, with a little variance.
 p.catches++; p.s=Math.min(158,p.s+2.0+Math.random()*2.2);
 p.flank+=(Math.random()*2-1)*28;
}}}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#dce8cd';g.fillRect(0,0,W,H);g.fillStyle='#d3c5a5';g.fillRect(0,270,W,55);g.fillRect(350,0,55,H);g.fillStyle='#777';for(const o of O)g.fillRect(o.x,o.y,o.w,o.h);function dot(e,col,ch){g.fillStyle=col;g.beginPath();g.arc(e.x,e.y,14,0,7);g.fill();g.fillStyle='white';g.font='bold 13px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,e.x,e.y)}for(const t of thieves)if(t.alive)dot(t,'#df4b4b','T');for(const p of cops)dot(p,'#3979d8','P');dot(me,'#e7b91e','★')}
function loop(n){let d=Math.min((n-last)/1000,.035);last=n;update(d,n);draw();requestAnimationFrame(loop)}
joy.onpointerdown=e=>{if(pid!==null)return;pid=e.pointerId;joy.setPointerCapture(pid);let r=joy.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;bs.style.left=ox+'px';bs.style.top=oy+'px';bs.style.display='block';moveJoy(e)};
function moveJoy(e){if(e.pointerId!==pid)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-ox,dy=e.clientY-r.top-oy,m=Math.hypot(dx,dy)||1,k=Math.min(42,m),ux=dx/m,uy=dy/m;kb.style.left=(31+ux*k)+'px';kb.style.top=(31+uy*k)+'px';jx=ux*Math.min(1,m/42);jy=uy*Math.min(1,m/42)}
joy.onpointermove=moveJoy;function end(e){if(e.pointerId!==pid)return;pid=null;jx=jy=0;bs.style.display='none';kb.style.left=kb.style.top='31px'}joy.onpointerup=end;joy.onpointercancel=end;
document.querySelector('#re').onclick=reset;document.querySelector('#ag').onclick=reset;reset();requestAnimationFrame(n=>{last=n;requestAnimationFrame(loop)})})();
</script></body></html>
